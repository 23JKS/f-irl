obj: airl
seed: 1
cuda: -1

env:
  env_name: HopperFH-v0
  T: 1000
  state_indices: all

irl:
  expert_episodes: 16
  eval_episodes: 20

sac:
  batch_size: 256
  lr: 0.0003
  alpha: 0.0

adv_irl:
  num_epochs: 500       # 总轮数
  steps_per_epoch: 10000  # 每轮收集10000步（10条轨迹）
  num_disc_updates_per_loop_iter: 4
  disc_optim_batch_size: 256
  replay_buffer_size: 1000000
  reward_scale: 1.0
  score_discrim: false 
