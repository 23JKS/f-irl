# f-IRL 多源任务配置（无VAE，与 trairl_ant_transfer_multisource.yml 对比用）
# 源任务: Leg1,2禁用 + Leg0,3禁用
# 目标任务: Leg0,2禁用（迁移评估用）

obj: emd
IS: false
seed: 1
cuda: -1

source_envs:
  - AntLeg12Disabled-v0
  - AntLeg03Disabled-v0

env:
  env_name: AntLeg12Disabled-v0
  T: 1000
  state_indices: all

irl:
  training_trajs: 32
  n_itrs: 700
  save_interval: 0
  eval_episodes: 20
  expert_episodes: 16
  resample_episodes: 10

sac:
  k: 1
  epochs: 5
  log_step_interval: 5000
  update_every: 1
  random_explore_episodes: 1
  update_num: 1
  batch_size: 100
  lr: 0.001
  alpha: 0.2
  automatic_alpha_tuning: false
  buffer_size: 1000000
  num_test_episodes: 10
  reinitialize: false

reward:
  use_bn: false
  residual: false
  hid_act: relu
  hidden_sizes: [128, 128]
  clamp_magnitude: 10
  lr: 0.0001
  weight_decay: 1e-3
  gradient_step: 1
  momentum: 0.9
  anchor_lambda: 0.0

disc:
  reinit: false
  model_type: resnet_disc
  num_layer_blocks: 6
  hid_dim: 128
  hid_act: tanh
  use_bn: false
  clamp_magnitude: 5.0
  batch_size: 800
  lr: 0.0003
  weight_decay: 0.0001
  momentum: 0.9
  iter: 500

critic:
  lam: 0.5
  model_type: resnet_disc
  num_layer_blocks: 3
  hid_dim: 128
  hid_act: tanh
  use_bn: false
  batch_size: 800
  lr: 0.0003
  weight_decay: 0.0001
  momentum: 0.0
  iter: 800
