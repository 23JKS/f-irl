# new.py multi-source configuration — hyperparameters aligned with paper Table 5
# Source tasks: AntLeg12Disabled-v0, AntLeg03Disabled-v0
# Target task:  AntLeg02Disabled-v0

obj: emd
IS: false
seed: 1
cuda: -1

source_envs:
  - AntLeg12Disabled-v0
  - AntLeg03Disabled-v0

env:
  env_name: AntLeg12Disabled-v0
  T: 1000
  state_indices: all

target_env: AntLeg02Disabled-v0

irl:
  training_trajs: 32
  n_itrs: 700
  eval_episodes: 20
  expert_episodes: 16
  resample_episodes: 10

sac:
  k: 1
  epochs: 5
  log_step_interval: 5000
  update_every: 1
  random_explore_episodes: 1
  update_num: 1
  batch_size: 100
  lr: 0.001
  alpha: 0.2
  automatic_alpha_tuning: false
  buffer_size: 1000000
  num_test_episodes: 10
  reinitialize: false

reward:
  use_bn: false
  residual: false
  hid_act: relu
  hidden_sizes: [128, 128]
  clamp_magnitude: 10
  lr: 0.0001
  weight_decay: 1e-3
  gradient_step: 1
  momentum: 0.9
  anchor_lambda: 0.0

# Paper Table 5: disc [32, 32], update steps=10
critic:
  lam: 10
  model_type: resnet_disc
  num_layer_blocks: 2
  hid_dim: 32
  hid_act: tanh
  use_bn: false
  batch_size: 800
  lr: 3e-4
  weight_decay: 0.0
  momentum: 0.0
  iter: 500   # fallback only; critic_update_steps in trairl block takes effect

trairl:
  latent_dim: 16
  # Paper Table 5: encoder [32,32,32]+Tanh, decoder [64,64,64]
  enc_hidden: 32
  dec_hidden: 64
  beta_kl: 0.1
  lambda_vae: 1.0
  lambda_wgan: 1.0
  lambda_f: 1.0
  vae_lr: 3e-4
  # Paper Table 5: update steps = 10 for all components
  reward_update_steps: 10
  vae_update_steps: 10
  critic_update_steps: 10
  # Trajectory buffer size (max learner trajectories stored per task)
  buffer_max_trajs: 200
