# TraIRL multi-source configuration for `firl__vae/irl_samples.py`
# Source tasks:
#   1. Leg 1,2 disabled
#   2. Leg 0,3 disabled
# Target task:
#   3. Leg 0,2 disabled
#
# IMPORTANT:
# The current codebase does not appear to register these exact Ant env IDs yet.
# Replace the env names below with your actual registered gym IDs.

obj: emd
IS: false
seed: 1
cuda: -1

# Multi-source tasks used for joint training
source_envs:
  - AntLeg12Disabled-v0
  - AntLeg03Disabled-v0

# Kept for compatibility with the current script, which still uses env.T/state_indices
env:
  env_name: AntLeg12Disabled-v0
  T: 1000
  state_indices: all

# Target task for later transfer evaluation / reward transfer
target_env: AntLeg02Disabled-v0

irl:
  training_trajs: 32
  n_itrs: 700
  save_interval: 0
  eval_episodes: 20
  expert_episodes: 16
  resample_episodes: 10

sac:
  k: 1
  epochs: 5
  log_step_interval: 5000
  update_every: 1
  random_explore_episodes: 1
  update_num: 1
  batch_size: 100
  lr: 0.001
  alpha: 0.2
  automatic_alpha_tuning: false
  buffer_size: 1000000
  num_test_episodes: 10
  reinitialize: false

reward:
  use_bn: false
  residual: false
  hid_act: relu
  hidden_sizes: [128, 128]
  clamp_magnitude: 10
  lr: 0.0001
  weight_decay: 1e-3
  gradient_step: 1
  momentum: 0.9
  anchor_lambda: 0.0

critic:
  lam: 10
  model_type: resnet_disc
  num_layer_blocks: 3
  hid_dim: 128
  hid_act: tanh
  use_bn: false
  batch_size: 800
  lr: 0.0003
  weight_decay: 0.0001
  momentum: 0.0
  iter: 500

trairl:
  latent_dim: 16
  hidden_size: 256
  beta_kl: 0.1
  lambda_vae: 1.0
  lambda_wgan: 1.0
  lambda_f: 1.0
  joint_updates: 1
  critic_updates: 1
  vae_lr: 3e-4
