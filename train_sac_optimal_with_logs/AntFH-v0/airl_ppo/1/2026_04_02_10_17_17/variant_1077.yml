seed: 1
cuda: 0

env:
  env_name: AntFH-v0
  T: 1000

reward:
  pretrained: /home/qu/f-IRL/logs/AntFH-v0/exp-16/airl_imitation/3/model/reward_model_itr820_det5680_sto5719.pkl

# 对齐 imitation/scripts/config/train_rl.py seals_ant named config
# n_steps = batch_size(2048) // num_vec(1) = 2048
# normalize_reward=True: 用 VecNormalize 对奖励归一化（对齐 train_rl 默认行为）
policy:
  activation: Tanh     # 对齐 seals_ant activation_fn=Tanh
  net_arch: [64, 64]

ppo:
  n_steps: 2048        # = rl.batch_size // num_vec
  batch_size: 16       # PPO minibatch size，对齐 seals_ant rl_kwargs.batch_size
  n_epochs: 10
  learning_rate: 0.00017959211641976886
  clip_range: 0.3
  ent_coef: 3.1441389214159857e-06
  gae_lambda: 0.8
  gamma: 0.995
  max_grad_norm: 0.9
  vf_coef: 0.4351450387648799

normalize_reward: true   # 用 VecNormalize 归一化奖励，对齐 train_rl 默认 normalize_reward=True

total_timesteps: 10000000
eval_interval: 8192
n_eval_episodes: 10
