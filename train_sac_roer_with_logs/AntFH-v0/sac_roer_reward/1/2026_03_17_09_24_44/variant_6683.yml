# SAC 配置（Ant 环境，启用 ROER 优先级重加权）
seed: 1
cuda: 0

env:
  env_name: AntFH-v0
  T: 1000
  state_indices: all

reward:
  pretrained: /home/qu/f-IRL/logs/AntFH-v0/exp-16/fkl/1/2026_03_08_09_05_40/model/reward_model_itr433_det5709_sto5259.pkl
  use_bn: false
  residual: false
  hid_act: relu
  hidden_sizes: [128, 128]
  clamp_magnitude: 10
  lr: 0.0001
  weight_decay: 0.001
  gradient_step: 1
  momentum: 0.9
  anchor_lambda: 0.05

sac:
  # 基本训练设置
  epochs: 3000
  reinitialize: True    # train_env 已通过 r= 嵌入奖励，buffer 里存的就是学到的奖励，无需 relabeling
  k: 1
  log_step_interval: 5000
  update_every: 1
  random_explore_episodes: 1
  update_num: 1
  batch_size: 100
  lr: 0.0003
  alpha: 0.2
  automatic_alpha_tuning: true
  buffer_size: 1000000
  num_test_episodes: 20

  # 启用 ROER 机制
  enable_roer_priority: true
  # ROER 超参数 —— 对齐原版 MuJoCo 命令行参数:
  # python train_online.py --per_type=OER --min_clip=10 --max_clip=50 --gumbel_max_clip=7 --temp=4 --per_beta=0.01
  roer:
    lambda_: 0.01     # per_beta: EMA 更新速率，原版 MuJoCo 用 0.01
    beta: 4.0         # temp: TD error 缩放温度，原版 MuJoCo 用 4
    clip_min: 10.0    # min_clip: 优先级下界，原版 MuJoCo 用 10
    clip_max: 50.0    # max_clip: 优先级上界，原版 MuJoCo 用 50
  gumbel_max_clip: 7.0  # 原版默认值
 
  # 可选：预训练策略路径（如果需要）
  # pretrained: logs/AntFH-v0/.../policy_model.pth

irl:
  eval_episodes: 20
  training_trajs: 32
  expert_episodes: 16
  resample_episodes: 0
